<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひらがなマスター（書き順動画付き）</title>
    <style>
        /* 全体のデザイン設定 */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        /* スマホ風のコンテナ */
        .phone-container {
            width: 360px;
            background-color: #ffffff;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            border: 8px solid #2c3e50;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* アプリのヘッダー */
        .app-header {
            background: linear-gradient(135deg, #ff7675, #e84393);
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* アプリのメイン表示エリア */
        .app-body {
            padding: 15px;
            height: 540px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* タブ切り替えボタン */
        .tab-container {
            display: flex;
            background-color: #f1f2f6;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            border: none;
            background: none;
            padding: 8px;
            font-size: 14px;
            font-weight: bold;
            color: #747d8c;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #e84393;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        /* 一覧選択（グリッド表示） */
        .grid-view {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        .char-card {
            background-color: #f8f9fa;
            border: 2px solid #f1f2f6;
            border-radius: 10px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .char-card:hover {
            border-color: #ff7675;
            transform: translateY(-2px);
        }
        .char-card.empty {
            visibility: hidden;
            pointer-events: none;
        }
        .char-jp {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        .char-romaji {
            font-size: 10px;
            color: #a4b0be;
            text-transform: uppercase;
        }

        /* なぞり書きエリア */
        .practice-view {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .practice-view.active {
            display: flex;
        }

        /* 🆕 動画・アニメーション表示エリア */
        .video-area {
            width: 100px;
            height: 100px;
            background-color: #f1f2f6;
            border-radius: 12px;
            margin: 5px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border: 1px solid #dfe4ea;
        }
        .video-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* キャンバス（なぞり書きエリア） */
        .canvas-area {
            position: relative;
            width: 220px;
            height: 220px;
            background-color: #f8f9fa;
            border: 3px dashed #ced6e0;
            border-radius: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .canvas-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 140px;
            color: #dfe4ea;
            font-weight: bold;
            pointer-events: none;
            z-index: 1;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            cursor: crosshair;
        }

        /* 操作用ボタン群 */
        .control-btns {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 5px;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-clear { background-color: #dfe4ea; color: #2c3e50; }
        .btn-clear:hover { background-color: #ced6e0; }
        .btn-speak { background-color: #74b9ff; color: white; }
        .btn-speak:hover { background-color: #0984e3; }
        .btn-back { background-color: #a4b0be; color: white; width: 100%; margin-top: 10px;}

        .big-romaji {
            font-size: 16px;
            color: #747d8c;
            margin: 2px 0;
        }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="app-header" id="header-title">ひらがな MASTER</div>

    <div class="app-body">
        <div class="tab-container" id="tabs">
            <button class="tab-btn active" onclick="switchTab('list')">あいうえお表</button>
            <button class="tab-btn" onclick="switchTab('practice')">なぞり書き練習</button>
        </div>

        <div id="list-container" class="grid-view"></div>

        <div id="practice-container" class="practice-view">
            <div id="practice-target-jp" style="font-size: 28px; font-weight: bold; color: #2c3e50;">あ</div>
            <div id="practice-target-romaji" class="big-romaji">Romaji: a</div>

            <div class="video-area">
                <img id="stroke-animation" src="" alt="Stroke Order">
            </div>

            <div class="canvas-area">
                <div class="canvas-hint" id="canvas-guide-text">あ</div>
                <canvas id="writeCanvas" width="220" height="220"></canvas>
            </div>

            <div class="control-btns">
                <button class="action-btn btn-clear" onclick="clearCanvas()">❌ 消す</button>
                <button class="action-btn btn-speak" onclick="playCurrentVoice()">🔊 お手本音声</button>
            </div>
            
            <button class="action-btn btn-back" onclick="switchTab('list')">⬅ 一覧にもどる</button>
        </div>
    </div>
</div>

<script>
    // 1. 五十音図データ
    const hiraganaList = [
        {ja:"あ", ro:"a"},  {ja:"い", ro:"i"},  {ja:"う", ro:"u"},  {ja:"え", ro:"e"},  {ja:"お", ro:"o"},
        {ja:"か", ro:"ka"}, {ja:"き", ro:"ki"}, {ja:"く", ro:"ku"}, {ja:"け", ro:"ke"}, {ja:"こ", ro:"ko"},
        {ja:"さ", ro:"sa"}, {ja:"し", ro:"shi"},{ja:"す", ro:"su"}, {ja:"せ", ro:"se"}, {ja:"そ", ro:"so"},
        {ja:"た", ro:"ta"}, {ja:"ち", ro:"chi"},{ja:"つ", ro:"tsu"},{ja:"て", ro:"te"}, {ja:"と", ro:"to"},
        {ja:"な", ro:"na"}, {ja:"に", ro:"ni"}, {ja:"ぬ", ro:"nu"}, {ja:"ね", ro:"ne"}, {ja:"の", ro:"no"},
        {ja:"は", ro:"ha"}, {ja:"ひ", ro:"hi"}, {ja:"ふ", ro:"fu"}, {ja:"へ", ro:"he"}, {ja:"ほ", ro:"ho"},
        {ja:"ま", ro:"ma"}, {ja:"み", ro:"mi"}, {ja:"む", ro:"mu"}, {ja:"め", ro:"me"}, {ja:"も", ro:"mo"},
        {ja:"や", ro:"ya"}, {ja:"", ro:""},     {ja:"ゆ", ro:"yu"}, {ja:"", ro:""},     {ja:"よ", ro:"yo"},
        {ja:"ら", ro:"ra"}, {ja:"り", ro:"ri"}, {ja:"る", ro:"ru"}, {ja:"れ", ro:"re"}, {ja:"ろ", ro:"ro"},
        {ja:"わ", ro:"wa"}, {ja:"", ro:""},     {ja:"", ro:""},     {ja:"", ro:""},     {ja:"を", ro:"wo"},
        {ja:"ん", ro:"n"}
    ];

    // 🆕 外部の書き順GIFアニメーションリポジトリへの紐付け関数
    // ここでは、一般的なUnicode（16進数表記）から書き順GIF（パブリックドメインのデータ等）を引っ張るURLスキームを設定しています。
    function getStrokeGifUrl(char) {
        if (!char) return "";
        const codePoint = char.charCodeAt(0).toString(16).toLowerCase();
        // Wikimedia等で管理されている一般的なStroke Orderのパス、もしくはご自身で用意した「assets/images/あ.gif」等への差し替えも可能です
        return `https://commons.wikimedia.org/wiki/Special:FilePath/Hiragana_${char}_stroke_order_animation.gif`;
    }

    let currentSelected = hiraganaList[0];

    // 2. 五十音表を画面に生成
    const listContainer = document.getElementById('list-container');
    hiraganaList.forEach(item => {
        const card = document.createElement('div');
        if(item.ja === "") {
            card.className = 'char-card empty';
        } else {
            card.className = 'char-card';
            card.innerHTML = `<div class="char-jp">${item.ja}</div><div class="char-romaji">${item.ro}</div>`;
            card.onclick = () => selectCharacter(item);
        }
        listContainer.appendChild(card);
    });

    // 文字を選択した時の処理
    function selectCharacter(item) {
        currentSelected = item;
        speakText(item.ja);
        
        document.getElementById('practice-target-jp').innerText = item.ja;
        document.getElementById('practice-target-romaji').innerText = `Romaji: ${item.ro}`;
        document.getElementById('canvas-guide-text').innerText = item.ja;
        
        // 🆕 選択された文字に合わせて書き順アニメーションGIFのソースを切り替え
        const animImg = document.getElementById('stroke-animation');
        animImg.src = getStrokeGifUrl(item.ja);
        
        switchTab('practice');
        clearCanvas();
    }

    // 3. タブ切り替えシステム
    function switchTab(tabName) {
        const listTab = document.getElementById('list-container');
        const practiceTab = document.getElementById('practice-container');
        const tabBtns = document.querySelectorAll('.tab-btn');

        if(tabName === 'list') {
            listTab.style.display = 'grid';
            practiceTab.classList.remove('active');
            tabBtns[0].classList.add('active');
            tabBtns[1].classList.remove('active');
            document.getElementById('header-title').innerText = "ひらがな MASTER";
        } else {
            listTab.style.display = 'none';
            practiceTab.classList.add('active');
            tabBtns[0].classList.remove('active');
            tabBtns[1].classList.add('active');
            document.getElementById('header-title').innerText = `「${currentSelected.ja}」の練習`;
        }
    }

    // 4. 音声機能
    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ja-JP';
        u.rate = 0.8;
        speechSynthesis.speak(u);
    }

    function playCurrentVoice() {
        speakText(currentSelected.ja);
    }

    // 5. キャンバスお絵描きの仕組み
    const canvas = document.getElementById('writeCanvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;

    ctx.strokeStyle = '#e84393'; 
    ctx.lineWidth = 10;          
    ctx.lineCap = 'round';       
    ctx.lineJoin = 'round';

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(getTouchPos(e)); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(getTouchPos(e)); });
    canvas.addEventListener('touchend', stopDrawing);

    function startDrawing(e) {
        isDrawing = true;
        ctx.beginPath();
        const x = e.clientX !== undefined ? e.offsetX : e.x;
        const y = e.clientY !== undefined ? e.offsetY : e.y;
        ctx.moveTo(x, y);
    }

    function draw(e) {
        if (!isDrawing) return;
        const x = e.clientX !== undefined ? e.offsetX : e.x;
        const y = e.clientY !== undefined ? e.offsetY : e.y;
        ctx.lineTo(x, y);
        ctx.stroke();
    }

    function stopDrawing() {
        isDrawing = false;
    }

    function getTouchPos(touchEvent) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: touchEvent.touches[0].clientX - rect.left,
            y: touchEvent.touches[0].top - rect.top
        };
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
</script>
</body>
</html>
